name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Bundle CSS gate (built output, not source)
        run: npm run build && node scripts/verify-bundle-css.mjs
