<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#9C4A1F" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Coffee Brew Log" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-180.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Sets data-theme before first paint to avoid a light/dark flash. Inline
		     on purpose (an external file would fetch after paint). Its exact bytes
		     are hashed into the CSP script-src in svelte.config.js — edit this and
		     you must update that hash, or the script is blocked and the flash
		     returns. Keep it dependency-free and self-contained. -->
		<script>
			(() => {
				try {
					const t = localStorage.getItem('theme') ?? 'system';
					const eff =
						t === 'system'
							? matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: t;
					document.documentElement.setAttribute('data-theme', eff);
				} catch {}
			})();
		</script>
		<!-- Service-worker registration lives in PwaUpdatePrompt via useRegisterSW
		     (prompt-style updates). A second manual register() here would bypass
		     that flow — and inside the Capacitor shell a SW can intercept chunk
		     loads and blank the screen, so the native build ships no SW at all. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
